name: Feature request
description: Something Castle does not do yet that you would use.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need Castle to do?
      description: Describe what you are trying to get done, not only the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What do you do today instead?
      description: Optional. Tell us how you get by without it.
  - type: input
    id: castle-version
    attributes:
      label: Castle version
      description: "Castle menu, About Castle. For example: 1.0.0 (142)."
