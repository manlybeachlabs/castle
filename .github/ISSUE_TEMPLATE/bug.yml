name: Bug report
description: Something in Castle did not work as it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for telling us. Please do not paste a license key into this issue.
  - type: input
    id: castle-version
    attributes:
      label: Castle version
      description: "Castle menu, About Castle. For example: 1.0.0 (142)."
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: "Apple menu, About This Mac. For example: macOS 26.1."
    validations:
      required: true
  - type: input
    id: mac-model
    attributes:
      label: Mac model
      description: "Apple menu, About This Mac. For example: MacBook Pro (14-inch, 2024), 24 GB memory."
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did Castle do instead? A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, in order, from opening Castle.
      placeholder: |
        1. Open Castle.
        2. ...
    validations:
      required: true
